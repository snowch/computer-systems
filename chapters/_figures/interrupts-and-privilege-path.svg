<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 466" width="780" height="466" role="img">
  <title>Dropping to supervisor mode and trapping back</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="466" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Leaving machine mode, and the only way back</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">There is no instruction for gaining privilege. A trap is the entire mechanism.</text>
  <rect x="32" y="86" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="98.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">machine</text>
  <text x="98.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">may do anything</text>
  <line x1="170" y1="112.0" x2="176" y2="112.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="182" y="86" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="248.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">mret</text>
  <text x="248.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">MPP says where to</text>
  <line x1="320" y1="112.0" x2="326" y2="112.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="332" y="86" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="398.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">supervisor</text>
  <text x="398.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">may not do this</text>
  <line x1="470" y1="112.0" x2="476" y2="112.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="482" y="86" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="548.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">trap</text>
  <text x="548.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">cause 2</text>
  <line x1="620" y1="112.0" x2="626" y2="112.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="632" y="86" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="698.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">machine</text>
  <text x="698.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">handler decides</text>
  <rect x="32" y="176" width="300" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="44" y="196.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mstatus.MPP = 1</text>
  <text x="346" y="196.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">supervisor is where mret will land</text>
  <rect x="32" y="208" width="300" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="44" y="228.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mepc = &amp;supervisor_probe</text>
  <text x="346" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">and this is where it starts</text>
  <rect x="32" y="240" width="300" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="44" y="260.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mret</text>
  <text x="346" y="260.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">the same instruction that returns from a trap</text>
  <rect x="32" y="272" width="300" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="44" y="292.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">csrr t0, mhartid</text>
  <text x="346" y="292.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">a machine-mode register, refused</text>
  <rect x="32" y="304" width="300" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="44" y="324.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mcause = 2</text>
  <text x="346" y="324.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">illegal instruction — the refusal is a trap</text>
  <rect x="32" y="336" width="300" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="44" y="356.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mstatus.MPP = 3, mret</text>
  <text x="346" y="356.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">the handler chooses to come back up</text>
  <line x1="24" y1="394" x2="756" y2="394" stroke="#c9ced6"/>
  <text x="24" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">mret restores no registers. Machine-mode code resuming here has the supervisor</text>
  <text x="24" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">caller's sp and ra, and must put its own back before it returns anywhere.</text>
</svg>
