<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 368" width="780" height="368" role="img">
  <title>Where interrupts come from</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="368" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Three sources, and only one countable answer</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">The work was fixed. Whether the interrupt count was fixed too depends on the device.</text>
  <rect x="24.0" y="86" width="230.66666666666666" height="132" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="40.0" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Disk</text>
  <text x="40.0" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">one completion per request</text>
  <line x1="36.0" y1="158" x2="242.66666666666666" y2="158" stroke="#c9ced6" stroke-dasharray="3 3"/>
  <text x="40.0" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="start">recorded</text>
  <text x="40.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">319 interrupts, every run</text>
  <rect x="274.66666666666663" y="86" width="230.66666666666666" height="132" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="290.66666666666663" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Console</text>
  <text x="290.66666666666663" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">“ready for more”, whenever that is</text>
  <line x1="286.66666666666663" y1="158" x2="493.33333333333326" y2="158" stroke="#c9ced6" stroke-dasharray="3 3"/>
  <text x="290.66666666666663" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="start">not recorded</text>
  <text x="290.66666666666663" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">a different number every run</text>
  <rect x="525.3333333333333" y="86" width="230.66666666666666" height="132" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="541.3333333333333" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Timer</text>
  <text x="541.3333333333333" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">once per tick of elapsed time</text>
  <line x1="537.3333333333333" y1="158" x2="743.9999999999999" y2="158" stroke="#c9ced6" stroke-dasharray="3 3"/>
  <text x="541.3333333333333" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="start">not recorded</text>
  <text x="541.3333333333333" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">a fact about the host, not the guest</text>
  <text x="24" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">A block request is completed once. “Ready for more” is not a unit of anything.</text>
  <line x1="24" y1="296" x2="756" y2="296" stroke="#c9ced6"/>
  <text x="24" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">Same image, same workload: the disk count was identical on every run and the console count was not, over a spread of nearly a third.</text>
  <text x="24" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">So one of these is a property of the work and the other is a property of the afternoon, and only one of them belongs in a table.</text>
</svg>
