<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img">
  <title>How a sampling profiler attributes a cycle</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="500" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">A profile is a sample of where the program was, not a record of where it went</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">Nothing watches the program. Something interrupts it, and writes down an address.</text>
  <rect x="24" y="88" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="90.0" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">a counter</text>
  <text x="90.0" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">counts cycles</text>
  <line x1="162" y1="114.0" x2="168" y2="114.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="174" y="88" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="240.0" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">overflow</text>
  <text x="240.0" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">it wraps</text>
  <line x1="312" y1="114.0" x2="318" y2="114.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="324" y="88" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="390.0" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">interrupt</text>
  <text x="390.0" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">the core traps</text>
  <line x1="462" y1="114.0" x2="468" y2="114.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="474" y="88" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="540.0" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">the PC</text>
  <text x="540.0" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">written down</text>
  <line x1="612" y1="114.0" x2="618" y2="114.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="624" y="88" width="132" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="690.0" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">a symbol</text>
  <text x="690.0" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">looked up later</text>
  <text x="24" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">The loop the samples land in</text>
  <rect x="24" y="214" width="732" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="38" y="236" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">load the key</text>
  <text x="250" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">sequential — in cache</text>
  <rect x="24" y="254" width="732" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="38" y="276" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">load the counter</text>
  <text x="250" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="start">scattered — this is the wait</text>
  <rect x="24" y="294" width="732" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="38" y="316" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">add one, store it back</text>
  <text x="250" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">cannot start until the load returns</text>
  <rect x="24" y="334" width="732" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="38" y="356" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">test and branch</text>
  <text x="250" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">where the sample is often written down</text>
  <text x="24" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#c2410c" text-anchor="start">The interrupt arrives some instructions after the one that caused the stall.</text>
  <line x1="24" y1="426" x2="756" y2="426" stroke="#c9ced6"/>
  <text x="24" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">So the report blames a cheap instruction standing next to an expensive one. The fix is to read the neighbourhood, never the line.</text>
  <text x="24" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">The loop above is the one the compiler emitted for this book’s scatter pass, 45 instructions in total.</text>
</svg>
