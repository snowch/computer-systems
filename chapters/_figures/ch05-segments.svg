<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 398" width="780" height="398" role="img">
  <title>How an executable's sections collapse into loadable segments</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="398" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Two views of the same bytes</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">Sections are for the linker. Segments are for whatever has to load the thing.</text>
  <rect x="24" y="86" width="250" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="36" y="107.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">.text</text>
  <text x="288" y="107.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">2368 bytes</text>
  <rect x="24" y="120" width="250" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="36" y="141.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">.rodata</text>
  <text x="288" y="141.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">145 bytes</text>
  <rect x="24" y="154" width="250" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="36" y="175.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">.eh_frame</text>
  <text x="288" y="175.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">1148 bytes</text>
  <rect x="24" y="188" width="250" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="36" y="209.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">.data</text>
  <text x="288" y="209.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">0 bytes</text>
  <rect x="24" y="222" width="250" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="36" y="243.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">.bss</text>
  <text x="288" y="243.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">32 bytes</text>
  <text x="24" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6270" text-anchor="start">18 sections, 5 of them loaded</text>
  <rect x="454" y="86" width="200" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="466" y="116.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">r-x  code</text>
  <text x="668" y="116.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">at 0</text>
  <rect x="454" y="138" width="200" height="52" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="466" y="168.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">rw-  data</text>
  <text x="668" y="168.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">at 4096  (32 bytes not in the file)</text>
  <text x="454" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6270" text-anchor="start">2 segments</text>
  <line x1="286" y1="171.0" x2="446" y2="112" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="286" y1="171.0" x2="446" y2="164" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="24" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">the loader is told: map this much, from here, and zero the rest</text>
  <line x1="24" y1="328" x2="756" y2="328" stroke="#c9ced6"/>
  <text x="24" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">A segment whose memory size exceeds its file size is asking for space that is not in</text>
  <text x="24" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">the file: .bss. Storing a megabyte of zeroes would be silly, so the format says how</text>
  <text x="24" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">many there are and the loader provides them.</text>
</svg>
