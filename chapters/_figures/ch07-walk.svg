<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 398" width="780" height="398" role="img">
  <title>Sv39 address translation</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="398" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">How Sv39 reads a virtual address</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">Nine bits per level, three levels, and twelve bits it never touches.</text>
  <rect x="24" y="82" width="285.9375" height="40" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="166.96875" y="106.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">63:39 — copies bit 38</text>
  <rect x="309.9375" y="82" width="102.9375" height="40" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="361.40625" y="106.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">L2</text>
  <rect x="412.875" y="82" width="102.9375" height="40" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="464.34375" y="106.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">L1</text>
  <rect x="515.8125" y="82" width="102.9375" height="40" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="567.28125" y="106.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">L0</text>
  <rect x="618.75" y="82" width="137.25" height="40" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="687.375" y="106.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">offset</text>
  <rect x="120" y="198" width="176" height="74" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="134" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">root table</text>
  <text x="134" y="244" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">512 entries</text>
  <text x="134" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">one entry covers 1 GiB</text>
  <line x1="361.40625" y1="122" x2="208.0" y2="194" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="361.40625" y="140" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="middle">L2</text>
  <rect x="320" y="198" width="176" height="74" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="334" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">second table</text>
  <text x="334" y="244" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">512 entries</text>
  <text x="334" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">one entry covers 2 MiB</text>
  <line x1="464.34375" y1="122" x2="408.0" y2="194" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="464.34375" y="140" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="middle">L1</text>
  <rect x="520" y="198" width="176" height="74" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="534" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">third table</text>
  <text x="534" y="244" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">512 entries</text>
  <text x="534" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">one entry covers 4 KiB</text>
  <line x1="567.28125" y1="122" x2="608.0" y2="194" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="567.28125" y="140" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="middle">L0</text>
  <text x="24" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">The offset is not translated. It is copied.</text>
  <line x1="24" y1="326" x2="756" y2="326" stroke="#c9ced6"/>
  <text x="24" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">Why nine: a 4096-byte page holds 512 entries of 8 bytes, and 512 is nine bits.</text>
  <text x="24" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">Three levels of nine, plus twelve of offset, is thirty-nine — which is where the name comes from.</text>
</svg>
