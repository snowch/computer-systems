<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418" width="780" height="418" role="img">
  <title>The path of one system call into the kernel and back</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="418" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">What one system call actually costs to arrange</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">The work you asked for is the box in the middle. Everything else is getting there.</text>
  <rect x="24" y="84" width="108" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="78.0" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">ecall</text>
  <text x="78.0" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">hardware traps</text>
  <line x1="138" y1="109.0" x2="144" y2="109.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="150" y="84" width="108" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="204.0" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">uservec</text>
  <text x="204.0" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">save 31 registers</text>
  <line x1="264" y1="109.0" x2="270" y2="109.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="276" y="84" width="108" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="330.0" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">usertrap</text>
  <text x="330.0" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">decide why</text>
  <line x1="390" y1="109.0" x2="396" y2="109.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="402" y="84" width="108" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="456.0" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">syscall</text>
  <text x="456.0" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">do the work</text>
  <line x1="516" y1="109.0" x2="522" y2="109.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="528" y="84" width="108" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="582.0" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">userret</text>
  <text x="582.0" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">restore 31</text>
  <line x1="642" y1="109.0" x2="648" y2="109.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="654" y="84" width="108" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="708.0" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">sret</text>
  <text x="708.0" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">back to user</text>
  <text x="24" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="start">and twice, in the middle of it, the address space changes</text>
  <text x="24" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">uservec switches to the kernel page table; userret switches back. That is why both</text>
  <text x="24" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">halves live in one page mapped at the same address in both — the trampoline.</text>
  <rect x="24" y="244" width="300" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="36" y="265.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">uservec  44 instructions</text>
  <text x="338" y="265.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">in</text>
  <rect x="24" y="278" width="300" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="36" y="299.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">userret  39 instructions</text>
  <text x="338" y="299.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">out</text>
  <text x="364" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">83 instructions of pure state movement,</text>
  <text x="364" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">before any of your work begins</text>
  <line x1="24" y1="348" x2="756" y2="348" stroke="#c9ced6"/>
  <text x="24" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">Counted, not timed. This target cannot say what an instruction costs, and a count is</text>
  <text x="24" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">what remains true anyway: the path is this long whatever machine runs it. ch26 prices</text>
  <text x="24" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">the same shape on hardware.</text>
</svg>
