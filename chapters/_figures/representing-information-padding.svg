<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 382" width="780" height="382" role="img">
  <title>Where the padding goes in two orderings of the same struct</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="382" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Two structs, the same three members</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">Declared in a different order, and one of them pays for it.</text>
  <text x="24" y="80" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">struct sysfs_declaration_order</text>
  <text x="354" y="80" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">char first; int middle; char last;</text>
  <rect x="24" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="45.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">first</text>
  <rect x="66" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="87.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <rect x="108" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="129.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <rect x="150" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="171.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <rect x="192" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="213.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">middle</text>
  <rect x="234" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="255.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">…</text>
  <rect x="276" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="297.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">…</text>
  <rect x="318" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="339.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">…</text>
  <rect x="360" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="381.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">last</text>
  <rect x="402" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="423.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <rect x="444" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="465.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <rect x="486" y="94" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="507.0" y="115.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <text x="45.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">0</text>
  <text x="87.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">1</text>
  <text x="129.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">2</text>
  <text x="171.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">3</text>
  <text x="213.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">4</text>
  <text x="255.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">5</text>
  <text x="297.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">6</text>
  <text x="339.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">7</text>
  <text x="381.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">8</text>
  <text x="423.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">9</text>
  <text x="465.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">10</text>
  <text x="507.0" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">11</text>
  <text x="544" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c2410c" text-anchor="start">12 bytes, 6 of them holes</text>
  <text x="24" y="184" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">struct sysfs_size_order</text>
  <text x="354" y="184" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">int middle; char first; char last;</text>
  <rect x="24" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="45.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">middle</text>
  <rect x="66" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="87.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">…</text>
  <rect x="108" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="129.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">…</text>
  <rect x="150" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="171.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">…</text>
  <rect x="192" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="213.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">first</text>
  <rect x="234" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="255.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">last</text>
  <rect x="276" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="297.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <rect x="318" y="198" width="42" height="34" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="339.0" y="219.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="middle">·</text>
  <text x="45.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">0</text>
  <text x="87.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">1</text>
  <text x="129.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">2</text>
  <text x="171.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">3</text>
  <text x="213.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">4</text>
  <text x="255.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">5</text>
  <text x="297.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">6</text>
  <text x="339.0" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle">7</text>
  <text x="376" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c2410c" text-anchor="start">8 bytes, 2 of them holes</text>
  <text x="24" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6270" text-anchor="start">·  a byte no member uses</text>
  <line x1="24" y1="312" x2="756" y2="312" stroke="#c9ced6"/>
  <text x="24" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">Two rules produce every gap: a member starts at a multiple of its own alignment, and</text>
  <text x="24" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">a struct is a multiple of its widest member's. The compiler may not reorder members to</text>
  <text x="24" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">avoid either — C forbids it — so the order you wrote is the order you pay for.</text>
</svg>
