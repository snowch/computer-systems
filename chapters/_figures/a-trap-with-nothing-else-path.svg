<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" width="760" height="536" role="img">
  <title>What the hardware does at a trap, and what it does not</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="760" height="536" fill="#ffffff"/>
  <text x="40" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">One trap, and the three registers that change</text>
  <text x="40" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">`bare` target — nothing else is running</text>
  <rect x="40" y="86" width="124" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="102.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">running</text>
  <text x="102.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">your instructions</text>
  <line x1="170" y1="111.0" x2="184" y2="111.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="190" y="86" width="124" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="252.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">ecall</text>
  <text x="252.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">the trap is caused</text>
  <line x1="320" y1="111.0" x2="334" y2="111.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="340" y="86" width="124" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="402.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">hardware</text>
  <text x="402.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">three writes</text>
  <line x1="470" y1="111.0" x2="484" y2="111.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="490" y="86" width="124" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="552.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">handler</text>
  <text x="552.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">at mtvec</text>
  <line x1="620" y1="111.0" x2="634" y2="111.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="640" y="86" width="124" height="50" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="702.0" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">mret</text>
  <text x="702.0" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="middle">back again</text>
  <text x="40" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">The hardware does exactly this, and stops:</text>
  <rect x="40" y="200" width="250" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="52" y="220.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mepc   = address of the ecall</text>
  <text x="304" y="220.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">the instruction, not the one after</text>
  <rect x="40" y="232" width="250" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="52" y="252.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mcause = 11</text>
  <text x="304" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">environment call from machine mode</text>
  <rect x="40" y="264" width="250" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="52" y="284.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">mstatus: MPIE = MIE, MIE = 0</text>
  <text x="304" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">so a second trap cannot arrive yet</text>
  <rect x="40" y="296" width="250" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="52" y="316.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">pc     = mtvec</text>
  <text x="304" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">and that is all</text>
  <text x="40" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">And what it does not do:</text>
  <rect x="40" y="376" width="250" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="52" y="396.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">registers</text>
  <text x="304" y="396.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">untouched — the handler's problem</text>
  <rect x="40" y="408" width="250" height="32" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="52" y="428.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">stack</text>
  <text x="304" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">untouched — there is no frame</text>
  <line x1="40" y1="464" x2="740" y2="464" stroke="#c9ced6"/>
  <text x="40" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">The handler must add 4 to mepc before returning: mepc is the address of the</text>
  <text x="40" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">instruction that trapped, so mret without it re-executes the ecall, for ever.</text>
</svg>
