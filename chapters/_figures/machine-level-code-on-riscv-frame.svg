<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 456" width="780" height="456" role="img">
  <title>A RISC-V stack frame and the two slots a backtrace walks</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="780" height="456" fill="#ffffff"/>
  <text x="24" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">A stack frame, and how to leave it</text>
  <text x="24" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5b6270" text-anchor="start">Two fixed slots turn the frames into a linked list, which is all a backtrace is.</text>
  <rect x="174" y="86" width="320" height="46" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="186" y="113.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">caller's frame</text>
  <rect x="174" y="132" width="320" height="46" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="186" y="159.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">saved fp  (fp-16)</text>
  <text x="508" y="159.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">where the caller's frame begins</text>
  <rect x="174" y="178" width="320" height="46" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="186" y="205.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">return address  (fp-8)</text>
  <text x="508" y="205.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">where to resume when this returns</text>
  <rect x="174" y="224" width="320" height="46" rx="4" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1"/>
  <text x="186" y="251.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">locals, spills, outgoing args</text>
  <text x="508" y="251.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">whatever would not fit in registers</text>
  <text x="24" y="140" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">fp →</text>
  <text x="24" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="start">this frame</text>
  <text x="24" y="270" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">sp →</text>
  <text x="24" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="start">the bottom</text>
  <line x1="548" y1="262" x2="548" y2="94" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="560" y="172.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="start">addresses</text>
  <text x="560" y="188.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6270" text-anchor="start">increase</text>
  <text x="560" y="210.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c2410c" text-anchor="start">the stack grows down</text>
  <text x="24" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6270" text-anchor="start">to climb one frame</text>
  <text x="24" y="338" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">return_address = fp[-1]</text>
  <text x="24" y="358" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">fp             = fp[-2]</text>
  <line x1="24" y1="386" x2="756" y2="386" stroke="#c9ced6"/>
  <text x="24" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">Only while frame pointers are kept. Compiled without them the slots are not written,</text>
  <text x="24" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">the list does not exist, and a backtrace has to be reconstructed from debug tables</text>
  <text x="24" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start">instead — which is why a release build's stack trace is so often a disappointment.</text>
</svg>
