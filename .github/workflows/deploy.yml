name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore MyST template cache
        uses: actions/cache@v4
        with:
          path: _build/templates
          # bench/results is in the key deliberately: a new measurement must invalidate anything
          # cached, or the site publishes stale numbers.
          key: myst-v1-${{ runner.os }}-node22-${{ hashFiles('package.json', 'myst.yml', 'bench/results/*.json') }}
          restore-keys: |
            myst-v1-${{ runner.os }}-node22-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MyST CLI (pinned)
        # Pinned via package.json so a build that worked yesterday cannot break with no commit.
        run: npm install -g "mystmd@$(node -p "require('./package.json').devDependencies.mystmd")"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Chapters contain no executable cells. Every figure is a committed fragment rendered by
      # scripts/render-figures.py from a stamped result, so publishing the book needs neither a
      # Jupyter kernel nor a RISC-V toolchain — which removes a whole class of deploy failure
      # that has nothing to do with the book.
      - name: Check the figures are current
        run: python3 scripts/render-figures.py --check

      - name: Build the book
        env:
          # base_path is "/" for a user site and "/repo" for a project site; MyST wants an empty
          # string at the root. Without this every asset and link 404s under /computer-systems/.
          BASE_URL: ${{ steps.pages.outputs.base_path == '/' && '' || steps.pages.outputs.base_path }}
        run: myst build --html --strict

      - name: Install Chromium for the PDF build
        # The PDF is rendered by a browser rather than by LaTeX: no TeX distribution needed, and
        # the output is what a reader gets by pressing Print on the HTML.
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: Build the single-file PDF
        # --no-myst because the site build above already parsed everything into _build/site.
        run: python3 scripts/build-pdf.py --no-myst --out _build/html/systems-from-scratch.pdf

      - name: Drop the intermediate HTML
        # build-pdf.py writes its assembled HTML beside the PDF. It is a build artefact, not a
        # page, and publishing it would put a second unstyled copy of the whole book on the site.
        run: rm -f _build/html/systems-from-scratch.html

      # After the PDF is in place, so a link to it is checked against a file that exists. This
      # runs here rather than in ci-check.sh because it needs the themed build, and the themed
      # build needs the template registry.
      - name: Check every file the pages link to was built
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path == '/' && '' || steps.pages.outputs.base_path }}
        run: python3 scripts/check-built-links.py _build/html "$BASE_URL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1800000

      - name: Backoff before retry
        if: ${{ steps.deploy1.outcome != 'success' }}
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: ${{ steps.deploy1.outcome != 'success' }}
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

      - name: Expose page URL (from the successful attempt)
        id: page
        if: ${{ always() }}
        run: echo "page_url=${{ steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}" >> $GITHUB_OUTPUT
