# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: systems-from-scratch
  title: Systems From Scratch
  description: >-
    From bits to cycles, measured on RISC-V. A self-study text on computer systems and
    performance — data representation, machine code, the operating system layer and CPU
    microarchitecture — built on the xv6 teaching kernel and measured natively on hardware
    whose performance counters actually work.
  keywords:
    - computer systems
    - performance
    - risc-v
    - xv6
    - operating systems
    - memory hierarchy
    - perf
    - microarchitecture
  authors:
    - name: Chris Snow
      url: https://snowch.github.io
  github: https://github.com/snowch/computer-systems
  license:
    content: CC-BY-NC-4.0
    code: Apache-2.0
  bibliography:
    - references.bib
  exclude:
    - README.md
    - PLAN.md
    - CLAUDE.md
